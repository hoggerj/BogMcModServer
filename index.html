<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Hog ModpackV2</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #b0b0b0;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      background-color: #3a3a3a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid #555;
      transition: 0.2s;
    }

    a.button:hover {
      background-color: #505050;
      border-color: #777;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>My Minecraft Modpack</h1>
    <p>Click below to download the modpack (.mrpack file)</p>

    <a class="button" href="BigHogModsV2.mrpack" download>
      Download Modpack
    </a>
  </div>
</body>

<details class="modbox">
  <summary>📦 View Mods</summary>
  <ul id="modList"></ul>
</details>

<script>
fetch('index.toml')
  .then(res => res.text())
  .then(text => {
    const mods = [];

    const lines = text.split("\n");

    for (const line of lines) {
      if (line.includes('file =')) {

        const match = line.match(/file\s*=\s*"([^"]+)"/);
        if (!match) continue;

        let path = match[1];

        // remove "mods/"
        path = path.replace("mods/", "");

        // remove ".pw.toml"
        path = path.replace(".pw.toml", "");

        mods.push(path);
      }
    }

    const list = document.getElementById("modList");

    mods.forEach(mod => {
      const li = document.createElement("li");
      li.textContent = mod;
      list.appendChild(li);
    });
  });
</script>

</html>
