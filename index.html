<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Big Hog ModpackV2</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 0;
    }

    .container {
      max-width: 500px;
      width: 100%;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #b0b0b0;
      margin-bottom: 30px;
    }

    a.button {
      display: inline-block;
      padding: 12px 20px;
      background-color: #3a3a3a;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      border: 1px solid #555;
      transition: 0.2s;
    }

    a.button:hover {
      background-color: #505050;
      border-color: #777;
    }

    .modbox ul {
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
    }
  </style>
</head>


<body>
  <div class="container">
    <h1>My Minecraft Modpack</h1>
    <p>Click below to download the modpack (.mrpack file)</p>

    <a class="button" href="BigHogModsV2.mrpack" download>
      Download Modpack
    </a>
    <details class="modbox">
      <summary>📦 View Mods</summary>
      <ul id="modList"></ul>
    </details>
  </div>
</body>


<script>
fetch('index.toml')
  .then(res => res.text())
  .then(text => {
    const mods = new Set();

    // matches file = "mods/whatever.pw.toml"
    const regex = /file\s*=\s*"([^"]+\.pw\.toml)"/g;

    let match;
    while ((match = regex.exec(text)) !== null) {
      let path = match[1]
        .replace("mods/", "")
        .replace(".pw.toml", "");

      mods.add(path);
    }

    const list = document.getElementById("modList");
    list.innerHTML = "";

    [...mods]
      .sort((a, b) => a.localeCompare(b))
      .forEach(mod => {
        const li = document.createElement("li");
        li.textContent = mod;
        list.appendChild(li);
      });
  })
  .catch(err => {
    console.error("Failed to load mod list:", err);
  });
</script>

</html>
